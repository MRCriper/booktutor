<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ignore benign Vite HMR WebSocket connection errors in AI Studio iframe environment
      window.addEventListener('error', function (e) {
        var msg = e && (e.message || (e.error && e.error.message) || '');
        var file = e && (e.filename || '');
        if (
          typeof msg === 'string' && (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('createWebSocketModuleRunnerTransport') !== -1
          ) ||
          typeof file === 'string' && file.indexOf('@vite/client') !== -1
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && (e.reason ? (e.reason.message || String(e.reason)) : '');
        if (
          typeof reason === 'string' && (
            reason.indexOf('WebSocket') !== -1 ||
            reason.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            reason.indexOf('@vite/client') !== -1
          )
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <title>Квант & Код — Платформа репетитора</title>
    <meta name="description" content="Интерактивная платформа для репетитора по математике, физике и информатике: бронирование слотов, IDE песочница кода с Piston API, банк задач, двухуровневый трекер экзаменов и отчеты для родителей." />
